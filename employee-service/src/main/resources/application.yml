server:
  port: 8082

spring:
  application:
    name: employee-service
  datasource:
    url: jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
  cloud:
    loadbalancer:
      cache:
        ttl: 5s                           # default 35s → expire instance cache after 5s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5   # default 30s → refresh registry every 5s
  instance:
    prefer-ip-address: true

department:
  service:
    url: http://department-service

resilience4j:

  # Opens after 50% of last 10 calls fail; recovers after 30s
  circuitbreaker:
    instances:
      department-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        register-health-indicator: true

  # 3 attempts with 500ms wait between each
  retry:
    instances:
      department-service:
        max-attempts: 3
        wait-duration: 500ms

  # Max 20 requests per second
  ratelimiter:
    instances:
      department-service:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 0ms

  # Max 10 concurrent calls at a time
  bulkhead:
    instances:
      department-service:
        max-concurrent-calls: 10
        max-wait-duration: 10ms

management:
  endpoints:
    web:
      exposure:
        include: health, circuitbreakers, retries, ratelimiters, bulkheads
  endpoint:
    health:
      show-details: always
